<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 108">
  <!--
    Favicon: the S mark alone on a transparent ground.
    The navy sweep would vanish against a dark tab strip, so it lightens under
    prefers-color-scheme: dark. The orange sweep never changes.
  -->
